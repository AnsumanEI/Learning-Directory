<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>18-Month Roadmap Tracker</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Syne:wght@400;500;600;700&display=swap');
:root {
  --bg:#0f0f0e;--surface:#1a1a18;--surface2:#222220;--border:rgba(255,255,255,0.07);
  --border2:rgba(255,255,255,0.12);--text:#e8e6e0;--muted:#7a786f;--hint:#4a4845;
  --teal:#2dd4a0;--teal-dim:rgba(45,212,160,0.12);
  --purple:#a78bfa;--purple-dim:rgba(167,139,250,0.12);
  --amber:#fbbf24;--amber-dim:rgba(251,191,36,0.12);
  --coral:#fb7185;--coral-dim:rgba(251,113,133,0.12);
  --blue:#60a5fa;--blue-dim:rgba(96,165,250,0.12);
  --green:#86efac;--green-dim:rgba(134,239,172,0.12);
  --mono:'JetBrains Mono',monospace;--sans:'Syne',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;}

/* HEADER */
.header{padding:24px 28px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
.header h1{font-size:18px;font-weight:700;letter-spacing:-0.02em;}
.header p{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:3px;}
.global-stats{display:flex;align-items:center;gap:16px;}
.stat-ring{display:flex;align-items:center;gap:10px;}
.ring-nums .pct{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--teal);}
.ring-nums .sub{font-family:var(--mono);font-size:10px;color:var(--muted);display:block;}
svg.ring{transform:rotate(-90deg);}
svg.ring circle{transition:stroke-dashoffset 0.5s ease;}

/* PHASE TABS */
.phase-tabs{display:flex;gap:0;border-bottom:1px solid var(--border);padding:0 28px;overflow-x:auto;scrollbar-width:none;}
.phase-tabs::-webkit-scrollbar{display:none;}
.phase-tab{font-family:var(--mono);font-size:10px;font-weight:500;padding:11px 18px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;transition:color 0.15s,border-color 0.15s;background:none;border-top:none;border-left:none;border-right:none;}
.phase-tab:hover{color:var(--text);}
.phase-tab.active{border-bottom-color:var(--teal);}
.phase-tab.p1.active{color:var(--teal);border-bottom-color:var(--teal);}
.phase-tab.p2.active{color:var(--purple);border-bottom-color:var(--purple);}
.phase-tab.p3.active{color:var(--amber);border-bottom-color:var(--amber);}
.phase-tab.p4.active{color:var(--coral);border-bottom-color:var(--coral);}

/* PHASE PANEL */
.phase-panel{display:none;padding:20px 28px 60px;}
.phase-panel.active{display:block;}
.phase-banner{padding:10px 16px;border-radius:8px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
.phase-banner h2{font-size:14px;font-weight:600;}
.phase-banner p{font-family:var(--mono);font-size:11px;opacity:0.8;}
.phase-progress{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;}
.phase-bar{width:120px;height:3px;background:rgba(255,255,255,0.1);border-radius:2px;}
.phase-bar-fill{height:100%;border-radius:2px;transition:width 0.4s;}

/* WEEK ACCORDION */
.week-block{border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden;}
.week-header{padding:12px 16px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;background:var(--surface);transition:background 0.15s;}
.week-header:hover{background:var(--surface2);}
.week-header-left{display:flex;align-items:center;gap:12px;}
.week-num{font-family:var(--mono);font-size:10px;color:var(--hint);}
.week-title{font-size:13px;font-weight:600;}
.week-theme{font-family:var(--mono);font-size:10px;color:var(--muted);margin-left:4px;}
.week-right{display:flex;align-items:center;gap:10px;}
.week-pct{font-family:var(--mono);font-size:10px;color:var(--muted);}
.week-chevron{font-family:var(--mono);font-size:11px;color:var(--hint);transition:transform 0.2s;}
.week-chevron.open{transform:rotate(90deg);}
.week-body{display:none;padding:14px 16px 16px;}
.week-body.open{display:block;}

/* DAY GRID */
.days-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px;margin-bottom:12px;}
.day-card{background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:12px 13px;transition:border-color 0.15s;}
.day-card.is-today{border-color:var(--teal);border-width:1.5px;}
.day-card.is-done{opacity:0.45;}
.day-card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
.day-date-wrap .dname{font-family:var(--mono);font-size:9px;color:var(--hint);text-transform:uppercase;letter-spacing:0.05em;}
.day-date-wrap .ddate{font-size:16px;font-weight:700;line-height:1.1;margin-top:1px;}
.day-card.is-today .ddate{color:var(--teal);}
.day-bigcheck{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--border2);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background 0.15s,border-color 0.15s;flex-shrink:0;}
.day-bigcheck:hover{border-color:var(--teal);}
.day-bigcheck.chk{background:var(--teal);border-color:var(--teal);}
.day-bigcheck svg{display:none;}
.day-bigcheck.chk svg{display:block;}
.tag{display:inline-block;font-family:var(--mono);font-size:9px;font-weight:500;padding:2px 7px;border-radius:20px;margin-bottom:6px;}
.tag-dsa{background:var(--teal-dim);color:var(--teal);}
.tag-be{background:var(--purple-dim);color:var(--purple);}
.tag-linux{background:var(--amber-dim);color:var(--amber);}
.tag-proj{background:var(--coral-dim);color:var(--coral);}
.tag-cloud{background:var(--blue-dim);color:var(--blue);}
.tag-review{background:rgba(255,255,255,0.05);color:var(--muted);}
.tag-interview{background:var(--green-dim);color:var(--green);}
.day-title{font-size:12px;font-weight:600;color:var(--text);margin-bottom:3px;line-height:1.3;}
.day-desc{font-size:11px;color:var(--muted);line-height:1.45;}
.tasks{margin-top:9px;border-top:1px solid var(--border);padding-top:9px;}
.task-item{display:flex;gap:7px;align-items:flex-start;margin-bottom:5px;cursor:pointer;}
.tcheck{width:13px;height:13px;border-radius:3px;border:1px solid var(--border2);background:none;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:background 0.12s;}
.tcheck.chk{background:var(--teal);border-color:var(--teal);}
.tcheck.chk::after{content:'✓';font-size:8px;color:#000;font-weight:800;}
.ttext{font-size:11px;color:var(--muted);line-height:1.4;}
.task-item.done .ttext{text-decoration:line-through;color:var(--hint);}

/* PROJECT CARD */
.proj-card{background:var(--surface);border:1px solid var(--border2);border-left:3px solid var(--coral);border-radius:8px;padding:12px 14px;margin-top:4px;}
.proj-card h4{font-family:var(--mono);font-size:10px;color:var(--coral);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:5px;}
.proj-card p{font-size:12px;color:var(--muted);line-height:1.55;}
.milestone-badge{display:inline-block;font-family:var(--mono);font-size:9px;padding:2px 8px;border-radius:3px;margin-right:4px;margin-bottom:4px;background:rgba(255,255,255,0.05);color:var(--muted);}

/* RESET */
.reset-btn{font-family:var(--mono);font-size:9px;color:var(--hint);background:none;border:1px solid var(--border);border-radius:4px;padding:3px 9px;cursor:pointer;transition:color 0.15s,border-color 0.15s;}
.reset-btn:hover{color:var(--coral);border-color:var(--coral);}
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>18-Month Roadmap Tracker</h1>
    <p>TCS → Product Company · Backend + Cloud/IoT · C++ · Mar 2026 – Sep 2027</p>
  </div>
  <div class="global-stats">
    <div class="stat-ring">
      <div class="ring-nums">
        <div class="pct" id="gpct">0%</div>
        <span class="sub" id="gsub">0/0 tasks</span>
      </div>
      <svg class="ring" width="48" height="48" viewBox="0 0 48 48">
        <circle cx="24" cy="24" r="20" fill="none" stroke="#1a1a18" stroke-width="4"/>
        <circle id="gring" cx="24" cy="24" r="20" fill="none" stroke="#2dd4a0" stroke-width="4"
          stroke-dasharray="125.7" stroke-dashoffset="125.7" stroke-linecap="round"/>
      </svg>
    </div>
  </div>
</div>

<div class="phase-tabs">
  <button class="phase-tab p1 active" onclick="showPhase(0)">Phase 1 · Foundation</button>
  <button class="phase-tab p2" onclick="showPhase(1)">Phase 2 · Core Skills</button>
  <button class="phase-tab p3" onclick="showPhase(2)">Phase 3 · Differentiation</button>
  <button class="phase-tab p4" onclick="showPhase(3)">Phase 4 · Job Ready</button>
</div>

<div id="phase-0" class="phase-panel active"></div>
<div id="phase-1" class="phase-panel"></div>
<div id="phase-2" class="phase-panel"></div>
<div id="phase-3" class="phase-panel"></div>

<script>
const STORAGE_KEY = 'tracker_18m_v1';

function loadState(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||{};}catch{return {};}}
function saveState(s){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(s));}catch(e){console.warn('Storage failed',e);}}
const START = new Date('2026-03-20');

function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}
function fmtDate(d){return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});}
function dayOfWeek(d){return['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()];}
function isToday(d){const t=new Date();return d.toDateString()===t.toDateString();}

// ─────────────────────────────────────────────
// FULL 18-MONTH DATA
// ─────────────────────────────────────────────
const PHASES = [
// ═══════════════════════════════════════════════
// PHASE 1 — FOUNDATION (Months 0-4, ~17 weeks)
// ═══════════════════════════════════════════════
{
  label:'Phase 1 — Foundation',
  sub:'Months 0–4 · DSA in C++ · Backend basics · Linux & Networking',
  color:'var(--teal)',
  weeks:[
    { title:'Week 1', theme:'STL + REST APIs + Linux basics', startOffset:0,
      project:{title:'C++ Key-Value Store',desc:'In-memory map<string,string> with get/set/delete via stdin. Save to .txt on exit, reload on start. ~80 lines. Push to GitHub.'},
      days:[
        {tag:'review',label:'Review',title:'Revision day',desc:'Skim STL notes. No new problems.',tasks:['Skim vector operations','Skim unordered_map — insert, find, count','Skim map vs unordered_map differences','Review set and priority_queue']},
        {tag:'dsa',label:'DSA',title:'Two Sum + Buy & Sell Stock I',desc:'LC #1 and #121. HashMap pattern. 30 min each.',tasks:['Solve Two Sum (LC #1) brute force','Optimise with unordered_map O(n)','Solve Best Time to Buy Stock (LC #121)','Write time & space complexity comments']},
        {tag:'be',label:'Backend',title:'HTTP basics + Install FastAPI',desc:'GET/POST/PUT/DELETE, status codes. Build 3 endpoints.',tasks:['Read HTTP methods + status codes (20 min)','pip install fastapi uvicorn','Write GET /hello endpoint','Write POST /echo endpoint','Write GET /items/{id} endpoint','Test all 3 with curl','Open localhost:8000/docs']},
        {tag:'dsa',label:'DSA',title:'Contains Duplicate + Valid Anagram',desc:'LC #217 and #242. HashMap pattern.',tasks:['Solve Contains Duplicate (LC #217)','Solve Valid Anagram (LC #242)','Try sorting approach for anagram too','Write complexity for both']},
        {tag:'be',label:'Backend',title:'FastAPI — query params + Pydantic',desc:'Add validation, query params, path params.',tasks:['Add GET /items?limit=5 query param','Add Pydantic request body model','Return 404 when item not found','Read FastAPI docs: Request Body section']},
        {tag:'dsa',label:'DSA',title:'Group Anagrams + Top K Frequent',desc:'LC #49 and #347. Medium — 45 min each.',tasks:['Solve Group Anagrams (LC #49)','Solve Top K Frequent Elements (LC #347)','Try min-heap approach for LC #347','Comment complexity for both']},
        {tag:'linux',label:'Linux',title:'Linux fundamentals',desc:'Do in terminal — not just reading.',tasks:['cd, ls -la, mkdir, rm, cp, mv','grep -r and find . -name "*.cpp"','chmod 755, chown basics','ps aux, kill, top, htop','df -h, du -sh, free -m','curl a URL and read raw response']},
      ]
    },
    { title:'Week 2', theme:'Sliding Window + FastAPI + Networking',startOffset:7,
      project:{title:'C++ libcurl HTTP Client',desc:'Use libcurl + nlohmann/json to call your FastAPI /users endpoint from C++. Create a user, fetch all. Push C++ client + Python server as one repo.'},
      days:[
        {tag:'dsa',label:'DSA',title:'Product of Array Except Self',desc:'LC #238. No division. Prefix + suffix arrays.',tasks:['Solve with prefix array (O(n) space)','Optimise to O(1) using output array','Trace through example by hand','Write complexity']},
        {tag:'proj',label:'Project',title:'C++ libcurl HTTP client',desc:'Call FastAPI from C++ using libcurl.',tasks:['Install libcurl and nlohmann/json','GET /hello from C++ and print response','POST /echo with JSON body from C++','Parse JSON response in C++','Push to GitHub as one repo']},
        {tag:'linux',label:'Linux',title:'TCP/IP + DNS',desc:'Use tcpdump to watch traffic live.',tasks:['Read: what happens when you type google.com','Understand DNS resolution steps','Understand TCP 3-way handshake','Run tcpdump -i any port 80 then curl','Understand IP vs TCP vs HTTP layers']},
        {tag:'dsa',label:'DSA',title:'Longest Substring + Sliding Window Max',desc:'LC #3 and #239. Two pointer in C++.',tasks:['Solve Longest Substring Without Repeat (LC #3)','Solve Sliding Window Maximum (LC #239)','Understand deque-based O(n) solution for #239','Draw the window visually for LC #3']},
        {tag:'be',label:'Backend',title:'FastAPI + SQLite',desc:'First DB-backed API. POST /users, GET /users.',tasks:['pip install sqlalchemy','Create User model: id, name, email','POST /users — insert into SQLite','GET /users — fetch all','GET /users/{id} — 404 if missing','Test with curl and /docs']},
        {tag:'dsa',label:'DSA',title:'Valid Parentheses + Min Stack',desc:'LC #20 and #155. Stack patterns.',tasks:['Solve Valid Parentheses (LC #20)','Solve Min Stack (LC #155)','Implement MinStack with two stacks in C++','Explain why auxiliary stack = O(1) getMin']},
        {tag:'linux',label:'Linux',title:'SSH + processes + cron',desc:'SSH into localhost, manage processes, write a cron job.',tasks:['Generate SSH key pair with ssh-keygen','SSH into localhost: ssh user@127.0.0.1','systemctl status/start/stop a service','Write bash script appending timestamp','Add to crontab to run every minute','Verify with tail -f logfile']},
      ]
    },
    { title:'Week 3', theme:'Binary Search + Trees + TLS', startOffset:14,
      project:{title:'C++ Threaded TCP Server',desc:'POSIX sockets echo server. Handle multiple clients with std::thread. Add SET/GET protocol with a map. Your first real networked C++ app.'},
      days:[
        {tag:'dsa',label:'DSA',title:'Binary Search + Rotated Array',desc:'LC #704 and #33. Master lo/hi/mid template.',tasks:['Solve Binary Search (LC #704)','Solve Search in Rotated Sorted Array (LC #33)','Memorise lo/hi/mid template','Write it as a reusable comment']},
        {tag:'proj',label:'Project',title:'C++ TCP echo server',desc:'POSIX sockets. Handle multiple clients.',tasks:['Write single-client TCP echo server (~40 lines)','Test with nc localhost 8080','Add std::thread for multiple clients','Add SET/GET protocol with map<string,string>','Test: SET name Arun → GET name → Arun','Push to GitHub']},
        {tag:'review',label:'Review',title:'3-week checkpoint',desc:'Recount LC, rerun projects, write READMEs.',tasks:['Count total LC problems — target 15+','Run KV store (Week 1 project)','Run libcurl client (Week 2 project)','Run TCP server (Week 3 project)','Write README for each project','List 3 things you struggled with']},
        {tag:'dsa',label:'DSA',title:'Invert BT + Max Depth',desc:'LC #226 and #104. Tree recursion intro.',tasks:['Write BinaryTree node struct in C++','Write insert and print functions','Solve Invert Binary Tree (LC #226)','Solve Max Depth of Binary Tree (LC #104)','Write iterative BFS version too']},
        {tag:'be',label:'Backend',title:'REST auth — API keys + JWT intro',desc:'Add auth to FastAPI. Understand JWT.',tasks:['Add X-API-Key header check','Return 401 if key wrong or missing','Read: what is JWT (header.payload.signature)','Understand API key vs JWT use cases','Read FastAPI security docs (30 min)']},
        {tag:'dsa',label:'DSA',title:'Same Tree + Subtree',desc:'LC #100 and #572. Tree comparison.',tasks:['Solve Same Tree (LC #100) recursively','Solve Subtree of Another Tree (LC #572)','Rewrite Same Tree iteratively with a stack','Understand O(n*m) naive complexity']},
        {tag:'linux',label:'Linux',title:'HTTP/HTTPS + TLS handshake',desc:'Inspect real TLS with openssl s_client.',tasks:['Read symmetric vs asymmetric encryption','Read TLS handshake steps','Run openssl s_client -connect google.com:443','Identify certificate and cipher suite','Understand why HTTPS prevents MITM']},
      ]
    },
    { title:'Week 4', theme:'Graphs intro + Docker basics', startOffset:21,
      project:{title:'Dockerise your TCP server',desc:'Write a Dockerfile for your C++ TCP server. Build and run it in a container. Push to Docker Hub.'},
      days:[
        {tag:'dsa',label:'DSA',title:'Number of Islands + Clone Graph',desc:'LC #200 and #133. Graph DFS/BFS.',tasks:['Solve Number of Islands (LC #200) with DFS','Solve it again with BFS','Solve Clone Graph (LC #133)','Understand adjacency list vs matrix in C++']},
        {tag:'be',label:'Backend',title:'FastAPI — middleware + CORS',desc:'Add CORS, logging middleware, error handling.',tasks:['Add CORS middleware to FastAPI','Add request logging middleware','Add global exception handler','Test from a browser fetch()']},
        {tag:'linux',label:'Linux',title:'Docker fundamentals',desc:'Build, run, push Docker containers.',tasks:['Install Docker','docker pull, run, ps, stop, rm','Write Dockerfile for a Python app','Build and run it: docker build + run','Push to Docker Hub']},
        {tag:'dsa',label:'DSA',title:'Pacific Atlantic + Surrounded Regions',desc:'LC #417 and #130. Multi-source BFS.',tasks:['Solve Pacific Atlantic Water Flow (LC #417)','Solve Surrounded Regions (LC #130)','Understand multi-source BFS pattern','Trace the flow by hand on a 4x4 grid']},
        {tag:'be',label:'Backend',title:'PostgreSQL + Docker Compose',desc:'Replace SQLite with Postgres in Docker.',tasks:['Write docker-compose.yml with FastAPI + Postgres','Connect FastAPI to Postgres via SQLAlchemy','Run with docker-compose up','Test all endpoints still work','Understand volumes for data persistence']},
        {tag:'dsa',label:'DSA',title:'Course Schedule I + II',desc:'LC #207 and #210. Topological sort.',tasks:['Solve Course Schedule (LC #207) — cycle detection','Solve Course Schedule II (LC #210)','Implement topological sort via DFS in C++','Implement via BFS (Kahn\'s algorithm) too']},
        {tag:'proj',label:'Project',title:'Dockerise TCP server',desc:'C++ app in Docker container.',tasks:['Write Dockerfile for C++ app (alpine base)','Build image successfully','Run container and test TCP connection','docker-compose for server + a test client','Push image to Docker Hub']},
      ]
    },
    { title:'Week 5', theme:'DP intro + REST design patterns', startOffset:28,
      project:{title:'REST API with auth + Postgres (production-ready)',desc:'Full FastAPI app: JWT auth, Postgres, CRUD for a resource (e.g. "devices"), Dockerised with docker-compose. This is your first real portfolio API.'},
      days:[
        {tag:'dsa',label:'DSA',title:'Climbing Stairs + House Robber',desc:'LC #70 and #198. DP intro — tabulation.',tasks:['Solve Climbing Stairs (LC #70) recursive','Optimise with memoisation','Optimise to O(1) space','Solve House Robber (LC #198)','Identify DP subproblem pattern']},
        {tag:'be',label:'Backend',title:'JWT auth in FastAPI',desc:'Full JWT login flow: register, login, protected routes.',tasks:['pip install python-jose passlib','Create /register and /login endpoints','Hash passwords with bcrypt','Generate JWT on login','Add protected route requiring JWT bearer token','Test the full flow with curl']},
        {tag:'dsa',label:'DSA',title:'Longest Common Subsequence + Edit Distance',desc:'LC #1143 and #72. Classic 2D DP.',tasks:['Solve LCS (LC #1143) — draw the DP table','Solve Edit Distance (LC #72)','Write both solutions with O(n*m) space','Optimise LCS to O(n) space']},
        {tag:'be',label:'Backend',title:'CRUD API for "devices" resource',desc:'Full REST CRUD with auth protection.',tasks:['GET /devices — list all (auth required)','POST /devices — create new device','GET /devices/{id} — fetch one','PUT /devices/{id} — update','DELETE /devices/{id} — delete','Test all with curl using JWT bearer token']},

        {tag:'be',label:'Backend',title:'Dockerise full API',desc:'docker-compose with FastAPI + Postgres + nginx.',tasks:['Add nginx as reverse proxy in docker-compose','Add environment variables for secrets','Write .env file (never commit this)','Run everything with docker-compose up -d','Test through nginx on port 80']},
        {tag:'review',label:'Review',title:'Month 1 checkpoint',desc:'Review DSA patterns learned, run all projects.',tasks:['List all LC problems solved this month','Categorise: HashMap / Stack / Graph / DP','Run and demo your devices API','Confirm Docker setup works end-to-end','Update GitHub README files']},
      ]
    },

      project:{title:'SQL query challenge set',desc:'Write 10 SQL queries on your Postgres devices DB: JOINs, GROUP BY, subqueries, window functions. Save them in a queries.sql file on GitHub.'},
      days:[
        {tag:'dsa',label:'DSA',title:'Subsets + Permutations',desc:'LC #78 and #46. Backtracking intro.',tasks:['Solve Subsets (LC #78)','Solve Permutations (LC #46)','Draw the recursion tree for a 3-element input','Write both in C++ with clean backtracking template']},
        {tag:'be',label:'Backend',title:'SQL deep dive',desc:'JOINs, GROUP BY, subqueries, indexes.',tasks:['Write INNER, LEFT, RIGHT JOIN queries','Write GROUP BY + HAVING queries','Write a subquery (SELECT inside SELECT)','Create an index and explain why it helps','Use EXPLAIN ANALYZE on a slow query']},
        {tag:'dsa',label:'DSA',title:'Combination Sum + Letter Combinations',desc:'LC #39 and #17. Backtracking patterns.',tasks:['Solve Combination Sum (LC #39)','Solve Letter Combinations of Phone Number (LC #17)','Identify the pruning condition in combination sum','Write clean recursive template in C++']},
        {tag:'be',label:'Backend',title:'Database design + migrations',desc:'Schema design, Alembic migrations.',tasks:['Read: normalisation (1NF, 2NF, 3NF)','Add a second model (e.g. DeviceReading) with FK','Write Alembic migration script','Run alembic upgrade head','Verify schema in psql']},
        {tag:'dsa',label:'DSA',title:'Word Search + N-Queens',desc:'LC #79 and #51. Grid backtracking.',tasks:['Solve Word Search (LC #79)','Solve N-Queens (LC #51) — understand constraint pruning','Draw the decision tree for N=4','Write C++ solution with clean visited array']},
        {tag:'be',label:'Backend',title:'Pagination + filtering',desc:'Add pagination and filtering to your list endpoints.',tasks:['Add ?page=1&limit=10 to GET /devices','Add ?status=active filter','Test with large datasets','Read about cursor-based vs offset pagination','Document in README why cursor > offset at scale']},
        {tag:'dsa',label:'DSA',title:'Palindrome Partitioning + Sudoku Solver',desc:'LC #131 and #37. Hard backtracking.',tasks:['Solve Palindrome Partitioning (LC #131)','Attempt Sudoku Solver (LC #37)','For Sudoku: understand constraint propagation','Time yourself: 45 min each']},
      ]

// RENDER ENGINE

let state = loadState();

function tkKey(pi,wi,di,ti){return`p${pi}w${wi}d${di}t${ti}`;}
function dayDoneKey(pi,wi,di){return`p${pi}w${wi}d${di}done`;}

function getDate(offsetDays){return addDays(START, offsetDays);}

function renderAll(){
  PHASES.forEach((phase, pi) => {
    const container = document.getElementById(`phase-${pi}`);

    // Phase banner
    const col = phase.color;
    const bannerDiv = document.createElement('div');
    bannerDiv.className = 'phase-banner';
    bannerDiv.style.background = col.replace('var(--','').replace(')','') === col ? col+'1a' : `color-mix(in srgb, ${col} 12%, transparent)`;
    bannerDiv.style.borderLeft = `3px solid ${col}`;
    const {done:pd, total:pt} = phaseProgress(pi);
    const ppct = pt ? Math.round(pd/pt*100) : 0;
    bannerDiv.innerHTML = `
      <div>
        <h2 style="color:${col}">${phase.label}</h2>
        <p>${phase.sub}</p>
      </div>
      <div class="phase-progress">
        <span style="color:${col}">${ppct}%</span>
        <div class="phase-bar"><div class="phase-bar-fill" style="width:${ppct}%;background:${col}"></div></div>
        <span>${pd}/${pt} tasks</span>
      </div>
    `;
    container.innerHTML = '';
    container.appendChild(bannerDiv);

    phase.weeks.forEach((week, wi) => {
      const weekDiv = document.createElement('div');
      weekDiv.className = 'week-block';
      const {done:wd,total:wt} = weekProgress(pi,wi);
      const wpct = wt ? Math.round(wd/wt*100) : 0;
      const isOpen = wi === 0 && pi === 0; // first week of first phase open by default

      weekDiv.innerHTML = `
        <div class="week-header" onclick="toggleWeek(this)">
          <div class="week-header-left">
            <span class="week-num">${week.title}</span>
            <span class="week-title">${week.theme}</span>
          </div>
          <div class="week-right">
            <span class="week-pct">${wpct}% · ${wd}/${wt}</span>
            <button class="reset-btn" onclick="event.stopPropagation();resetWeek(${pi},${wi})">reset</button>
            <span class="week-chevron${isOpen?' open':''}">▶</span>
          </div>
        </div>
        <div class="week-body${isOpen?' open':''}">
          <div class="days-grid" id="dg-${pi}-${wi}"></div>
          ${week.project ? `<div class="proj-card"><h4>Week project</h4><p><strong>${week.project.title}</strong> — ${week.project.desc}</p></div>` : ''}
        </div>
      `;
      container.appendChild(weekDiv);

      // render day cards
      const grid = weekDiv.querySelector(`#dg-${pi}-${wi}`);
      week.days.forEach((day, di) => {
        const dateObj = getDate(week.startOffset + di);
        const today = isToday(dateObj);
        const isDone = !!state[dayDoneKey(pi,wi,di)];
        const card = document.createElement('div');
        card.className = `day-card${today?' is-today':''}${isDone?' is-done':''}`;

        const tasksHtml = (day.tasks||[]).map((t,ti)=>{
          const k = tkKey(pi,wi,di,ti);
          const chk = !!state[k];
          return `<div class="task-item${chk?' done':''}" onclick="toggleTask(${pi},${wi},${di},${ti})">
            <div class="tcheck${chk?' chk':''}"></div>
            <span class="ttext">${t}</span>
          </div>`;
        }).join('');

        card.innerHTML = `
          <div class="day-card-top">
            <div class="day-date-wrap">
              <div class="dname">${dayOfWeek(dateObj)}</div>
              <div class="ddate">${fmtDate(dateObj)}</div>
            </div>
            <div class="day-bigcheck${isDone?' chk':''}" onclick="toggleDayDone(${pi},${wi},${di})">
              <svg width="11" height="11" viewBox="0 0 11 11" fill="none">
                <path d="M1.5 5.5l3 3 5-5" stroke="#000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
          </div>
          <span class="tag tag-${day.tag}">${day.label}</span>
          <div class="day-title">${day.title}</div>
          <div class="day-desc">${day.desc}</div>
          <div class="tasks">${tasksHtml}</div>
        `;
        grid.appendChild(card);
      });
    });
  });
  updateGlobalProgress();
}

function toggleWeek(header){
  const body = header.nextElementSibling;
  const chevron = header.querySelector('.week-chevron');
  const isOpen = body.classList.contains('open');
  body.classList.toggle('open', !isOpen);
  chevron.classList.toggle('open', !isOpen);
}

function toggleTask(pi,wi,di,ti){
  const k = tkKey(pi,wi,di,ti);
  state[k] = !state[k];
  saveState(state);
  renderAll();
}

function toggleDayDone(pi,wi,di){
  const k = dayDoneKey(pi,wi,di);
  state[k] = !state[k];
  saveState(state);
  renderAll();
}

function resetWeek(pi,wi){
  if(!confirm('Reset all progress for this week?')) return;
  PHASES[pi].weeks[wi].days.forEach((d,di)=>{
    delete state[dayDoneKey(pi,wi,di)];
    (d.tasks||[]).forEach((_,ti)=>delete state[tkKey(pi,wi,di,ti)]);
  });
  saveState(state);
  renderAll();
}

function weekProgress(pi,wi){
  let total=0,done=0;
  PHASES[pi].weeks[wi].days.forEach((d,di)=>{
    (d.tasks||[]).forEach((_,ti)=>{total++;if(state[tkKey(pi,wi,di,ti)])done++;});
  });
  return{done,total};
}

function phaseProgress(pi){
  let total=0,done=0;
  PHASES[pi].weeks.forEach((_,wi)=>{const p=weekProgress(pi,wi);total+=p.total;done+=p.done;});
  return{done,total};
}

function updateGlobalProgress(){
  let total=0,done=0;
  PHASES.forEach((_,pi)=>{const p=phaseProgress(pi);total+=p.total;done+=p.done;});
  const pct=total?Math.round(done/total*100):0;
  document.getElementById('gpct').textContent=pct+'%';
  document.getElementById('gsub').textContent=`${done}/${total} tasks`;
  const c=125.7;
  document.getElementById('gring').setAttribute('stroke-dashoffset',c-(c*pct/100));
}

function showPhase(idx){
  document.querySelectorAll('.phase-panel').forEach((p,i)=>p.classList.toggle('active',i===idx));
  document.querySelectorAll('.phase-tab').forEach((t,i)=>t.classList.toggle('active',i===idx));
}

renderAll();
</script>
</body>
</html>

<!DOCTYPE html>
<html>

<head>
    <title>
        Adding audio to webpage
    </title>
</head>

<body>
    <audio controls muted loop autoplay preload="metadata">
        <p> Lutt le gaya from dhurandar </p>
        <source src="Lutt Le Gaya (From Dhurandhar).mp3" type="audio/mpeg">
        <!--we can use multiple files too , also metadata means itll download it automatically before playing-->>
    </audio>
</body>

</html>

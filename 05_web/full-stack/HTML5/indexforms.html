<!DOCTYPE html>
<html>

<head>
    <title>forms in webpage</title>
</head>
<!--also one method is get used for insenstive data , post is used for sensitive data -->
<!--action sends the data to the php file name mentioned , this is learned in the php language -->

<body>
    <h1>Fill up the form </h1>
    <form action="index.php" method="POST" enctype="multipart/form-data">
        <label for="username">username:</label>
        <input type="text" placeholder="username 4 - 15 char" id="username" minlength="4" required maxlength="15">


        <br><br>
        <label for="password">password:</label>
        <input type="password" placeholder="6-15 chars" id="password" minlength="6" maxlength="15" required>
        <br><br>
        <label for="emailid">email id:</label>
        <input type="email" id="emailid" placeholder="xyz@mail.com">
        <br><br>
        <label for="phone"> mobile no. :</label>
        <input type="tel" id="phone" placeholder="+91 123-4567-890 " minlength="10" maxlength="10"
            pattern="[0-9]{3}-[0-9]{4}-[0-9]{3}">
        <br><br>
        <label for="birthday"> DOB :</label>
        <input type="date" id="birthday">
        <br><br>
        <label for="quant">quantity</label>
        <input placeholder="0-99" type="number" id="quant" min="0" max="99" value="">
        <br><br>
        <label for="title">title:</label>
        <label for="mr.">mr.</label>
        <input id="mr." value="mr." type="radio" name="title">
        <label for="ms.">ms.</label>
        <input id="ms." value="ms." type="radio" name="title">
        <label for="phd">phd.</label>
        <input id="phd" value="phd" type="radio" name="title">
        <br><br>
        <label for="payment">payment gateway:</label>
        <select id="payment">
            <option value="visa">visa</option>
            <option value="upi">upi</option>
            <option value="cod">cash on delivery</option>
        </select>
        <br><br>
        <label>liked it?</label><br>
        <label for="yes">yes</label>
        <input value="yes" type="checkbox" id="yes">
        <label for="no">no</label>
        <input value="no" type="checkbox" id="no"><br><br>

        <label for="feedback">Input your feedback here:</label> <br>
        <textarea id="feedback" name="feedbacktext" placeholder="enter your feedback here" rows="5" cols="25">
</textarea>
        <br>
        <label for="file"> file:</label>
        <input type="file" id="file" name="file" accept="image/png,image/jpeg,video/mp4">
        <br>
        <br>
        <input type="submit">
        <input type="reset">

    </form>

</body>

</html>

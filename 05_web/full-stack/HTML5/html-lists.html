<!DOCTYPE html>
<html>

<head>
    <title>diffrent list types</title>
</head>

<body>
    <!--unordered list-->>
    <h4>Groceries</h4>
    <ul>
        <li>milk</li>
        <li>egg</li>
        <li>coffee supplies</li>
        <ul>
            <li>cream</li>
        </ul>
    </ul>
    <!--ordered list-->
    <h4>todo list</h4>
    <ol>
        <li>walking</li>
        <li>coding</li>
        <ul>
            <li>c++</li>
            <li>html</li>
        </ul>
        <li>sleeping</li>
    </ol>
    <!--description list-->
    <h4>Dungeon creatures</h4>
    <dl style="background-color: lightblue; border: 2px dotted;">
        <dt>dragon</dt>
        <dd>defination here</dd>
        <dt>phoenix</dt>
        <dd>defination here</dd>
        <dt>vampire</dt>
        <dd>defination here</dd>
        <dt>werewolf</dt>
        <dd>defination here</dd>
    </dl>
</body>

</html>

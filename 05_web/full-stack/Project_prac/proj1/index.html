<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimatix dashboard</title>
    <link rel="stylesheet" href="style.ss">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        href="https://fonts.googleapis.com/css2?family=Quantico:ital,wght@0,400;0,700;1,400;1,700&family=Quicksand:wght@300..700&display=swap"
        rel="stylesheet">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>

<body>
    <main>
        <div class="Results-summary">
            <div class="results grid-flow" data-spacing="large">
                <h1 class="section-title">Your results</h1>
                <p class="result-score">
                    <span>76</span>of 100
                </p>
                <div class="grid-flow">
                    <p class="result-rank">Great</p>
                    <p> you have scored higher than 65% of
                        of the people who have
                        taken the test </p>
                </div>
            </div>
            <div class="summary grid-flow" data-spacing="large">

                <h2 class="section-title">Summary</h2>

                <div class="grid-flow">
                    <div class="summary-item" data-item-type="accent-1">
                        <div class="flex-group">

                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                                class="summary-icon">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M7.864 4.243A7.5 7.5 0 0 1 19.5 10.5c0 2.92-.556 5.709-1.568 8.268M5.742 6.364A7.465 7.465 0 0 0 4.5 10.5a7.464 7.464 0 0 1-1.15 3.993m1.989 3.559A11.209 11.209 0 0 0 8.25 10.5a3.75 3.75 0 1 1 7.5 0c0 .527-.021 1.049-.064 1.565M12 10.5a14.94 14.94 0 0 1-3.6 9.75m6.633-4.596a18.666 18.666 0 0 1-2.485 5.33" />
                            </svg>

                            <h3 class="summary-item-title">Reaction</h3>
                        </div>
                        <p class="summary-score"><span>80</span>/100</p>
                    </div>

                    <div class="summary-item" ,data-item-type="accent-2">
                        <div class="flex-group">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                                class="summary-icon">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M11.412 15.655 9.75 21.75l3.745-4.012M9.257 13.5H3.75l2.659-2.849m2.048-2.194L14.25 2.25 12 10.5h8.25l-4.707 5.043M8.457 8.457 3 3m5.457 5.457 7.086 7.086m0 0L21 21" />
                            </svg>

                            <h3 class="summary-item-title">Mental</h3>
                        </div>
                        <p class="summary-score"><span>90</span>/100</p>
                    </div>

                    <div class="summary-item" data-item-type="accent-3">
                        <div class="flex-group">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                                class="summary-icon">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M20.25 8.511c.884.284 1.5 1.128 1.5 2.097v4.286c0 1.136-.847 2.1-1.98 2.193-.34.027-.68.052-1.02.072v3.091l-3-3c-1.354 0-2.694-.055-4.02-.163a2.115 2.115 0 0 1-.825-.242m9.345-8.334a2.126 2.126 0 0 0-.476-.095 48.64 48.64 0 0 0-8.048 0c-1.131.094-1.976 1.057-1.976 2.192v4.286c0 .837.46 1.58 1.155 1.951m9.345-8.334V6.637c0-1.621-1.152-3.026-2.76-3.235A48.455 48.455 0 0 0 11.25 3c-2.115 0-4.198.137-6.24.402-1.608.209-2.76 1.614-2.76 3.235v6.226c0 1.621 1.152 3.026 2.76 3.235.577.075 1.157.14 1.74.194V21l4.155-4.155" />
                            </svg>

                            <h3 class="summary-item-title">Verbal</h3>
                        </div>
                        <p class="summary-score"><span>76</span>/100</p>
                    </div>

                    <div class="summary-item" data-item-type="accent-4">
                        <div class="flex-group">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                                class="summary-icon">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                            </svg>

                            <h3 class="summary-item-title">Visual</h3>
                        </div>
                        <p class="summary-score"><span>91</span>/100</p>
                    </div>
                </div>
                <button class="button">Continue </button>
            </div>
    </main>
</body>

</html>

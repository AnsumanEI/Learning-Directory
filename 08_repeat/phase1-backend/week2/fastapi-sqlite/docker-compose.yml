

services:
  db:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data  # This must be a list under the service
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 5
      timeout: 10s

  web:
    build: .
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
        db:
          condition: service_healthy
        redis:
          condition: service_started
        rabbitmq:
          condition: service_started
  
  web2:
      build: .
      ports:
        - "8002:8000"
      environment:
        DATABASE_URL: ${DATABASE_URL}
      depends_on:
          db:
            condition: service_healthy
          redis:
            condition: service_started
          rabbitmq:
            condition: service_started


  nginx: 
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on: 
      - web
      - web2
  
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
  
  celery_worker:
   build: .
   command: celery -A celery_app worker --loglevel=info
   environment:
     DATABASE_URL: ${DATABASE_URL} #not neeeded yet because we are nt fetching from db but just in case added for my understanding
   depends_on:
     - redis
     - db
  
  flower:
    build: .
    command: celery -A celery_app flower
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - celery_worker


  
volumes:
  postgres_data:  # Top-level volumes must be a mapping (key: value)


# named group of backend servers
# nginx distributes requests across all servers (round robin by default)
# add more servers here + matching services in docker-compose to scale
upstream fastapi_app {

    #least_conn; for changing the load balancing , default is round robin
    #ip_hash;
    server web:8000;
    server web2:8000;
    # server web3:8000;
}

server {
    listen 80; # accept all traffic on port 80
    server_name _; # _ = catch all domains, no specific domain filtering

    # log every incoming request (IP, time, URL, status code)
    access_log /var/log/nginx/access.log;
    # log anything that goes wrong (bad config, upstream failures, 502s)
    error_log /var/log/nginx/error.log;

    # compress text-based responses before sending to client
    # images/videos already compressed — no point compressing them again
    gzip on;
    gzip_types text/plain application/json text/html;
    gzip_min_length 1000; # skip compression for tiny responses — saves CPU

    location / {
        # forward all requests to FastAPI upstream group
        # Docker resolves service names (web/web2/web3) to container IPs
        proxy_pass http://fastapi_app;

        # tell FastAPI the original domain client requested
        proxy_set_header Host $host;
        # tell FastAPI the real client IP (not nginx's IP)
        proxy_set_header X-Real-IP $remote_addr;
    }
}
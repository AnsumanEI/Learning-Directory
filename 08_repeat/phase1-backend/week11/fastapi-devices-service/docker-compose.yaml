

services:
  db:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data  # This must be a list under the service
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 5
      timeout: 10s

  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
        db:
          condition: service_healthy
        redis:
          condition: service_started
        rabbitmq:
          condition: service_started
  
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
      
  
  celery_worker:
   build: .
   command: celery -A app.celery_app worker --loglevel=info
   env_file:
     - .env
   depends_on:
     - redis
     - rabbitmq
     - db

volumes:
  postgres_data:  # Top-level volumes must be a mapping (key: value)

